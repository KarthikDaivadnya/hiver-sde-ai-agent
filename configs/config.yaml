brand: AmazonHelp

embedding_model: sentence-transformers/all-MiniLM-L6-v2

llm:
  provider: groq
  model: openai/gpt-oss-20b
  temperature: 0.2
  reasoning_effort: low
  max_completion_tokens: 1024

retrieval:
  top_k: 3
  candidate_k: 10
  score_threshold: 0.65

paths:
  intent_model: backend/artifacts/intent_model
  retrieval_index: backend/artifacts/faiss/amazonhelp.index
  retrieval_corpus: backend/artifacts/corpus/amazonhelp_corpus.csv